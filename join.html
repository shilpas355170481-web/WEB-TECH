<!DOCTYPE html>
<html>
<head>
    <title>SkillBridge - Join</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>SkillBridge</h1>
    <p>Join Our Student Community</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="skills.html">Skills</a>
    <a href="join.html">Join Us</a>
</nav>

<main>
    <section>
        <h2>Join SkillBridge</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="skill">Skill You Offer:</label>
            <input type="text" id="skill" name="skill">

            <label for="learn">Skill You Want to Learn:</label>
            <input type="text" id="learn" name="learn">

            <label for="message">Why do you want to join?</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Join SkillBridge</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 SkillBridge | Learn & Collaborate</p>
</footer>
</body>
</html>
